; Nodo ESP32 de Centinela — spec docs/diseno/2026-10-16-enlace-edge-design.md §3.1.
; Versiones fijadas a propósito: un build de hoy debe ser igual al del sábado.

[platformio]
default_envs = esp32dev

[common]
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  knolleary/PubSubClient@2.8

; ESP32 "clásico" (DevKit v1 / WROOM-32): el más común en placas sueltas.
[env:esp32dev]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}

; ESP32-S3 (el del manual v2). Memoria del N16R8 real (16 MB flash, 8 MB PSRAM octal), confirmada con esptool.
[env:esp32s3]
platform = platformio/espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags = -DBOARD_HAS_PSRAM
lib_deps = ${common.lib_deps}

; El mismo S3, pero cargando por WiFi (README "Actualizar por WiFi"). Contraseña e IP por variable de entorno, nunca en git:
;   NODO_IP=192.168.1.15 OTA_PASS=$(cat ~/firmware-centinela/.ota_pass) pio run -e esp32s3-ota -t upload
[env:esp32s3-ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = ${sysenv.NODO_IP}
upload_flags = --auth=${sysenv.OTA_PASS}

; ESP32-CAM AI-Thinker (OV2640 + PSRAM). En config.h: CAMARA_MODELO CAMARA_AI_THINKER y BOTON_PIN -1.
[env:esp32cam]
platform = platformio/espressif32@7.1.3
board = esp32cam
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}

; Tests del protocolo en la PC, sin placa: pio test -e native
[env:native]
platform = native
lib_deps = bblanchon/ArduinoJson@7.4.3
build_flags = -std=gnu++17
